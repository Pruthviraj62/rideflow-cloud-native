apiVersion: v1
kind: Namespace
metadata:
  name: rideflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rider-service
  namespace: rideflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rider-service
  template:
    metadata:
      labels:
        app: rider-service
    spec:
      containers:
        - name: rider-service
          image: 893471991585.dkr.ecr.ap-south-1.amazonaws.com/rideflow-rider-service:v0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rideflow-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rider-service
  namespace: rideflow
spec:
  type: ClusterIP
  selector:
    app: rider-service
  ports:
    - name: http
      port: 8001
      targetPort: http
---
