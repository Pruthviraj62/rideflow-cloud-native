apiVersion: apps/v1
kind: Deployment
metadata:
  name: rideflow-kafka
  namespace: rideflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rideflow-kafka
  template:
    metadata:
      labels:
        app: rideflow-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka
              containerPort: 9092
          env:
            - name: KAFKA_LOG_DIRS
              value: "/data/kafka-migration-staging/fresh-cutover/kafka-logs"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://rideflow-kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx256m"
          resources:
            requests:
              cpu: 200m
              memory: 400Mi
            limits:
              cpu: 700m
              memory: 700Mi
          volumeMounts:
            - name: kafka-data
              mountPath: /data
      nodeSelector:
        topology.kubernetes.io/zone: ap-south-1b
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: rideflow-kafka-data-b
---
apiVersion: v1
kind: Service
metadata:
  name: rideflow-kafka
  namespace: rideflow
spec:
  type: ClusterIP
  selector:
    app: rideflow-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
